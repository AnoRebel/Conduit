name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check all packages
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Upload client artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: packages/client/dist/
          retention-days: 7

      - name: Upload server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-dist
          path: packages/server/dist/
          retention-days: 7

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun run test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/client/coverage/lcov.info,packages/server/coverage/lcov.info
          fail_ci_if_error: false

  test-e2e:
    name: Admin UI E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # The suite drives a system-installed browser and never downloads one.
      # ubuntu-latest ships Google Chrome, so no install step is needed; the
      # shim exists because Chrome's sandbox cannot initialise in the runner
      # container, and bunwright 0.3.2 provides no way to pass --no-sandbox
      # (its backend.argv option is declared in the types but never used).
      # Fails loudly if Chrome is ever absent rather than skipping silently.
      - name: Prepare Chrome
        id: chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome found on the runner; the end-to-end suite cannot run."
            exit 1
          fi
          "$CHROME" --version
          printf '#!/usr/bin/env bash\nexec %s --no-sandbox --disable-dev-shm-usage "$@"\n' "$CHROME" > "$RUNNER_TEMP/chrome-shim"
          chmod +x "$RUNNER_TEMP/chrome-shim"
          echo "path=$RUNNER_TEMP/chrome-shim" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run end-to-end smoke tests
        run: bun run --filter=@conduit/admin-ui test:e2e
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.path }}

  test-go:
    name: Go Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Go vet
        run: go vet ./...
        working-directory: packages/go-client

      - name: Go test
        run: go test ./... -race -count=1
        working-directory: packages/go-client

      - name: Go build check
        run: go build ./...
        working-directory: packages/go-client
